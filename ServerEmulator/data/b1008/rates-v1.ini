; Independent server multipliers, loaded at server startup.
; Saved rewards are not recalculated.
; Range 0..20, up to two decimal places, decimal point (examples: 1, 1.5, 2).
[rates]
drop=1
experience=1
fletta=1
carat=1

; drop sets regular bag count: x1=1, x2=2, x5=5. A fractional rate gives
; floor(rate) bags plus one more with probability equal to its fractional part.
; Each bag selects ordinary/craft/potion by weights among eligible species pools.
; Equipment is separate: one roll at 5% * drop, capped at 100%, at most one item.
; Quest items retain their own chance/rate/missing-quantity rules outside this budget.
; Class/level eligibility and item quantities stay the same.
; Currency remains one separate bag; only carat scales its amount (0 disables it).
; experience affects mob and quest EXP; fletta multiplies FP per completed bar.
; Charging speed is unchanged; x5 pays 5 FP at 100%, then the remainder continues.
; Free Fletta cap is max(character level, ceil(fletta rate)) FP, including charge.
; Thus x5 allows 5 FP at levels1..5, 6 at level6, etc. Full capacity displays 100%.
; Integer rewards round half up once. Grants, trading and existing inventory are unaffected.
