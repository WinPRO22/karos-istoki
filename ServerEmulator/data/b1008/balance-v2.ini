; Authored b1008 reconstruction v2. Rewards load on restart; threshold changes require explicit save migration.
[balance]
profile=b1008-reconstruction-v2
level_cap=45
spider_exp=16
quest_19003003_exp=24

[combat]
; Fixed fallback for equipment-less probes only. Normal sessions roll class base + equipped weapon range.
normal_hit_damage=22
; User screenshots 2010-2012 show critical damage 1.2. Working reconstruction:
; TOTAL multiplier 120%, floor after the normal roll; not a recovered CBT formula.
critical_damage_percent=120
; Combined Fletta: 1250 = 12.5%; 10000 forces eligible hits for manual tests.
fletta_proc_basis_points=1250
wind_barrier_defense_rating=4
; Ordinary outgoing PvE only. User anchors: equal levels 2% TOTAL,
; mob +4 levels 30%, player +3 levels 0%. Linear decrease below that lead.
; Higher mob: 2% + 7 percentage points per level. Authored upper cap 95%.
; Rating is a server-side BONUS, not an inferred original character base stat.
; Chance = capped level chance / (1 + bonus/100), truncated to basis points.
; Split total equally (1 bp rounding). Hero +3 remains guaranteed to connect.
miss_fail_equal_basis_points=200
miss_fail_higher_level_basis_points=700
miss_fail_zero_player_lead=3
attack_rating_scale=100
miss_fail_max_basis_points=9500
; Legacy nominal-defense curve for diagnostic/custom content with attack_min=0.
; Berneo uses the raw attack/defense model in [monsters] below.
; Authored defense curve, NOT a recovered CBT server formula.
; Mob attack_damage is nominal damage against reference defense 67.
; final = max(1, round(nominal * (curve + reference) / (curve + defense))).
; User CBT-video observation: Lv1 Blader in starter armor receives 1 from Spider.
; Only the armored hit is an observed anchor. Unarmored damage is a test estimate.
; Zero nominal stays zero. At nominal 1: armor 67/52/21 -> damage 1/1/2.
physical_defense_curve=10
mob_damage_reference_defense=67

[monsters]
; Authored calibration from our Classic controlled Spider tests (2026-09-21).
; HP50 inferred from nonlethal hits/HP percentages. Attack13..17 and 0.21*defense
; fit the five armor states (21/36/51/59/67), not the original server formula.
; Defense15 reproduces the usual unarmed16 -> damage13; its value is a choice.
; Fixed mob levels/zones: each base stat * 1.08^(level-1), rounded once.
; Never scale existing enemies to the player's level.
base_hp=50
base_attack_min=13
base_attack_max=17
base_defense=15
growth_percent=8
physical_defense_percent=21
; User-adjusted interval: 1000ms/base becomes 1400ms/base before scheduler cadence.
; Client animation speed is scaled by the reciprocal, 100/140.
attack_cycle_percent=140

[profession_balance]
; Authored profession identity, applies at both ranks after class promotion.
; Speed follows equipped sword/polearm subtype even before class promotion.
; It multiplies native ordinary attack playback, not movement or skill cooldown.
; Physical attack/defense scale permanent base+gear once before Fletta/buffs.
sword_attack_speed_percent=110
spear_attack_speed_percent=90
spear_physical_attack_percent=120
spear_physical_defense_percent=108

