; Authored server balance, not a recovered original cooldown.
; All HP potion sizes share one timer; all MP sizes share another.
; Timers survive reconnect/restart and start only after successful consumption.
; Changing bag cells or shortcut cells does not reset them. Restart to reload.
[potions]
hp_cooldown_ms=100
mp_cooldown_ms=100

; b1008 06/02 acknowledges item use and finishes the actor action.
; Its native cooldown branch is subtype 19 (return item), not potion subtype 7.
; Do not send 06/2B with potion IDs: that parser expects the return-item table.
